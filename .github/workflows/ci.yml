name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -v

  interface:
    name: Lint and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install verification dependencies
        run: python -m pip install -r requirements-browser.txt ruff
      - name: Lint Python
        run: python -m ruff check .
      - name: Lint JavaScript
        run: npx --yes eslint@10 static
      - name: Install Chromium and Linux dependencies
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Run browser checks
        run: python -m unittest -v browser_checks
